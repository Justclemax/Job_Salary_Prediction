name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Smoke training run
        run: uv run python -W ignore -m salary.train --fast --models ridge lightgbm --no-tune
      - run: uv run pytest tests/test_artifacts.py

# Streamlit app + Rust inference server. Ports read from .env (see .env.example).
#   uv run python -m salary.train && uv run python -m salary.export
#   docker compose up --build        # app on :${STREAMLIT_SERVER_PORT}, API on :${API_PORT}
services:
  api:
    build:
      context: .
      dockerfile: serving/Dockerfile
    ports: ["${API_PORT:-8000}:8000"]
    mem_limit: 64m
    restart: unless-stopped

  app:
    build: .
    ports: ["${STREAMLIT_SERVER_PORT:-8501}:8501"]
    environment:
      SALARY_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

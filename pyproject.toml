[project]
name = "salary"
version = "0.1.0"
description = "Job salary prediction: statistics, causal inference, gradient boosting, Streamlit app"
readme = "README.md"
authors = [
    { name = "Clément KM", email = "90102062+Justclemax@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "dowhy>=0.14",
    "econml>=0.17.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "pingouin>=0.7.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
    "xgboost>=3.4.1",
]

[project.scripts]
salary = "salary:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["notebook"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["salary", "ui", "illustrations"]

[package]
name = "salary-serve"
version = "0.1.0"
edition = "2024"
description = "Serveur d'inférence Rust pour les modèles de salaire (forêts LightGBM exportées en JSON)"
publish = false

[dependencies]
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
